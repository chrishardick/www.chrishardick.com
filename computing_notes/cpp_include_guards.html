<h1>C++ Include Guards</h1>

<ul>
<li>Use include guards to ensure a header file is only included once when compiling a given source file
<li>Including a header file multiple times is not only inefficient, it usually also leads to a compilation error
</ul>

<pre>
#ifndef HEADER_H
#define HEADER_H

//

#endif // HEADER_H
