<H1>sendmail</H1>

<UL>
<LI>sendmail hangs on start-up
	<UL>
	<LI>try putting only one entry for the local machine in /etc/hosts
	<PRE>
	127.0.0.1 localhost.localdomain localhost
	</PRE>
	<LI>if this works, the system is probably trying to look up one of your alternate names via dns (and failing)
	</UL>
</UL>
