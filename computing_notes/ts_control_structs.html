<h1>TypeScript - Control Structures</h1>

<h2>for...of Loop</h2>
<ul>
<li>Keep in mind that while JS has a <code>for...in</code> loop contruct, TS has a <code>for...<strong>of</strong></code> construct
</ul>

<pre>
let arr = [10, 20, 30, 40];

for (var a of arr)
{
    console.log (a);
}
