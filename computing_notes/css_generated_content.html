<h1>CSS - Generated Content</h1>

<ul>
<li>Let's say you wanted to suffix every h2 element with the paragraph symbol -- &para; similar to the Python web site, you could use the following:
<pre>h2:after { content: " &para;;" }</pre>
<li>Similarly, if you wanted a prefix:
<pre>h2:before { content: " &para;;" }</pre>
