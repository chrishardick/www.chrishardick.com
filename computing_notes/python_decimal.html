<h1>Python: <code>decimal</code> module</h1>

<ul>
<li>The <code>decimal</code> module provides support for decimal floating point
</ul>


<pre>
import decimal

x = decimal.Decimal(1.1) + decimal.Decimal(2.2)

print ("%f" % (x))                  # will print out 3.3
print ("type=%s" % (type(x)))       # will print out decimal.Decimal
