<body>
<div id="nav" class="nav"></div>
<div id="title" class="title"></div>


<!-- 
C O N T E N T
-->

<div id="content" class="content">
<h1>HTML: SVG Tester</h1>

<p>svg width=400 height=650</p>
<p>
<select id="drawing_element">
<option value="disk" selected>disk</option>
<option value="rect">rect</option>
</select>
</p>


<table>
<tr>
<td>
<svg id="svg" width="400" height="650" xmlns="http://www.w3.org/2000/svg" style="border-style: solid;">
<text id="txt1" x="20" y="20" font-size="12" text-anchor="left" fill="black">Hello, World!</text>

<path id="disk1" 
    d=" M 100 100 A 2 1, 0 0 0, 50 100 
        M 100 100 A 2 1, 0 0 1, 50 100
        M 50 100 v 50
        M 100 100 v 50
        M 100 150 A 2 1, 0 0 1, 50 150"
        fill="transparent" stroke="black"/>

<rect x="200" y="100" height="50" width="50" fill="transparent" stroke="black" /> 

<path 
    d=" M 100 400
        h 100
        v 100
        m -100 -100
        v 100
        h 100
        m -100 -100
        "
        fill="transparent" stroke="black"/>
            
</svg>
</td>
<td style="vertical-align: top">
Hello, World!
</td>
</tr>
</table>


<script>

let ns = "http://www.w3.org/2000/svg";

window.addEventListener("load", onLoad);

// document.getElementById("draw_button").addEventListener("click",drawIt);

function printObj (obj)
{
    for (prop in obj)
    {
        console.info ("primtObj: " + prop + "=" + obj[prop]);
    }
}

function onLoad (e)
{
    console.info ("onLoad: ENTER");

    let svgNode = document.getElementById('svg');


    // 'click' listener for entire svg element

    svgNode.addEventListener("click",onClick);


    // 'mousedown' event for each svg child element

    let childNodes = svgNode.childNodes;

    for (let i=0; i< childNodes.length; i++)
    {
        let node = childNodes[i];

        node.addEventListener("mousedown",mouseDown);
        console.log("onLoad: id=" + node.id);
    }
}


function drawRect (x, y)
{
    console.info ("drawRect: x=" + x + " y=" + y);

    let svgNode = document.getElementById('svg');
    
    let elm = document.createElementNS(ns, "rect");
    elm.setAttribute("x",x);
    elm.setAttribute("y",y);
    elm.setAttribute("height",50);
    elm.setAttribute("width" ,50);
    elm.setAttribute("fill","transparent");
    elm.setAttribute("stroke","black");

    let ch = svgNode.appendChild(elm);

    // <rect x="200" y="100" height="50" width="50" fill="transparent" stroke="black" /> 
}


function drawDisk (x, y)
{
    console.info ("drawDisk: x=" + x + " y=" + y);

    let x1 = x+50;
    let y1 = y+50;

    let d="";
    d += "M " + x + " " + y + " A 2 1 ,0 0 1, " + x1 + " " + y;
    d += "M " + x + " " + y + " A 2 1 ,0 0 0, " + x1 + " " + y;
    d += "M " + x + " " + y + " v 50";
    d += "M " + x1 + " " + y + " v 50";
    d += "M " + x + " " + y1 + " A 2 1 ,0 0 0, " + x1 + " " + y1;

    console.info ("drawDisk: d=" + d);

    let svgNode = document.getElementById('svg');

    let elm = document.createElementNS(ns, "path");
    
    elm.setAttribute("d",d);
    elm.setAttribute("stroke","black");
    elm.setAttribute("fill","transparent");

    let ch = svgNode.appendChild(elm);
}


function onClick (e)
{
    console.info ("onClick: e=" + e);

    // convert to coordinates relative to svg container
    var tgt = e.target;
    var dim = tgt.getBoundingClientRect();
    var x = parseInt(e.clientX - dim.left);
    var y = parseInt(e.clientY - dim.top);
    console.info ("onClick: x=" + x + " y=" + y);
    
    var drawing_element = document.getElementById('drawing_element').value;

    console.info ("onClick: drawing_element=" + drawing_element);

    switch (drawing_element)
    {
        case "disk":
            drawDisk(x, y);
            break;

        case "rect":
            drawRect(x, y);
            break;
    }

    // printObj(e);
}

function mouseDown (e)
{
    /*
    for (prop in e)
    {
        console.info ("mouseDown: event: " + prop + "=" + e[prop]);

        if (prop == "target")
        {
            for (pp in e[prop])
            {
                console.info ("mouseDown: object: " + pp "=" + e[prop][pp]);
            }
        }
    }
    */

    let id = undefined;

    if ("target" in e)
    {
        let tgt = e["target"];

        if ("id" in tgt)
        {
            id = tgt["id"];
        }
    }
    
    console.info ("mouseDown: object id = " + id);
}

</script>


</div>
</body>
</html>
