<h1>Git Hooks</h1>

<ul>
<li><strong>Git Hooks</strong> allow you to execute custom scripts when certain events occur
<li>There are two main types of hooks - client-side and server-side
<li>Client-side hooks are run locally
<li>Server-side hooks run on network operations (e.g. receiving pushed commits)
