function displayTime() 
{
    var e = document.getElementById("clock");

    var now = new Date();

    e.innerHTML = now.toLocaleTimeString();
    
    setTimeout(displayTime,1000);
}

window.onload = function ()
{
    var elements = document.getElementsByClassName("reveal");

    for (var i=0; i<elements.length; i++)
    {
        var e = elements[i];

        var title = e.getElementsByClassName("handle")[0];

        title.onclick = function()
        {
            if (e.className == "reveal") e.className = "revealed";
            else if (e.className == "revealed") e.className = "reveal";
        }
    }

    var clock = document.getElementById("clock");

    clock.onclick = displayTime;
};

function Rectangle (w, h)
{
    this.m_w = w;
    this.m_h = h;

    Rectangle.prototype.area = function() { return this.m_w * this.m_h; }

    Rectangle.prototype.width  = function() { return this.m_w; }
    Rectangle.prototype.height = function() { return this.m_h; }

    Rectangle.prototype.set_height = function(h) { this.m_h = h; }
    Rectangle.prototype.set_width  = function(w) { this.m_w = w; }
}

var r1 = new Rectangle (1, 2);

document.write ("area of rectangle1 with width=" + r1.width() + " height=" + r1.height() + " is " + r1.area() + "<br>");

r1.set_height(5);
r1.set_width(6);

document.write ("area of rectangle1 with width=" + r1.width() + " height=" + r1.height() + " is " + r1.area() + "<br>");
